[project]
name = "xrayvpn-client"
version = "0.1.0"
description = "Python client for provisioning Xray VLESS + REALITY VPN servers (local and remote execution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fabric>=3.2.3",
    "inquirerpy>=0.3.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
xrayvpn = "xrayvpn.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xrayvpn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
