---
# Python client CI for the xrayvpn CLI (split out of molecule.yml).
#
# Jobs:
#   gate — always-on change classifier: on a docs-only pull request it marks
#     docs_only and the heavy legs below skip. A conditionally skipped job
#     reports "skipped", which counts as a successful status even if the
#     repo later starts requiring these checks; workflow_dispatch always
#     runs everything. The identical gate block lives in molecule.yml too
#     (deliberate duplication; a reusable workflow would be overkill for two).
#   python-tests — pytest suite + ruff for python-client (incl. the static
#     xrayvpn-deploy.pyw <-> CLI-flags contract test); future python legs
#     (version matrix, etc.) belong here.

name: python-client

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: classify changes (python-client)
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Docs-only check
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -vE '\.md$|^docs/|^LICENSE' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  python-tests:
    name: python-client tests
    needs: gate
    if: needs.gate.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python-client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('python-client/uv.lock') }}
          restore-keys: uv-

      - name: Sync dependencies from lockfile
        run: uv sync --frozen

      - name: Pytest
        run: uv run python -m pytest -q

      - name: Ruff
        run: uv run python -m ruff check .
