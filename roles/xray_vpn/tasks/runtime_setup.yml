---
# Common runtime setup — runs before any runtime_X.yml.
# Installs runtime-agnostic apt dependencies and derives the two facts used
# by every runtime-specific path:
#   - xray_container_image: explicit xray_docker_image override, or
#     "{{ xray_container_repo }}:{{ xray_version }}" when unset.
#   - xray_cli_command: full invocation that leads to the `xray` CLI on
#     the target — the native binary path, or
#     `docker run --rm <image> xray` / `podman run --rm <image> xray`
#     (the trailing `xray` is the binary name inside the container).
#     Keys.yml calls `{{ xray_cli_command }} x25519` uniformly.

- name: Install runtime-agnostic apt dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - unzip
    state: present
    update_cache: true
  become: true

- name: Set xray_container_image (override or derived from version)
  ansible.builtin.set_fact:
    xray_container_image: >-
      {{
        xray_docker_image
        if (xray_docker_image | default('') | length > 0)
        else (xray_container_repo ~ ':' ~ xray_version)
      }}

- name: Set xray_cli_command per runtime
  ansible.builtin.set_fact:
    xray_cli_command: >-
      {{
        '/usr/local/bin/xray'
        if (xray_runtime == 'native')
        else (
          'docker run --rm ' ~ xray_container_image ~ ' xray'
          if (xray_runtime == 'docker')
          else 'podman run --rm ' ~ xray_container_image ~ ' xray'
        )
      }}
