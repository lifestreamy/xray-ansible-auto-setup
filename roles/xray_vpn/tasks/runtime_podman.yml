---
# Podman runtime (experimental; not covered by molecule).
# Installs Podman from Ubuntu repos and pulls the pinned Xray
# container image. The systemd unit rendered by main.yml
# (xray.service.podman.j2) handles the actual `podman run --rm`.
#
# This is experimental because:
#   - rootless podman + systemd-as-pid-1 needs lingering/logind,
#     which adds setup steps; the role currently runs podman as
#     root for simplicity.
#   - molecule does not exercise this path; coverage is
#     syntax-check only.
#   - containers.podman Ansible collection is in maintenance mode.

- name: Install Podman from Ubuntu repos
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
  become: true
  tags: podman

- name: Pull pinned Xray container image for podman
  ansible.builtin.command:
    cmd: podman pull {{ xray_container_image }}
  changed_when: false
  register: podman_pull
  become: true
  tags: podman

- name: Debug podman pull result
  ansible.builtin.debug:
    var: podman_pull
  when: xray_debug | default(false) | bool
  tags: podman,debug
