---
# Install Docker
- name: Install Docker from Ubuntu repos
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  become: true
  tags: docker

- name: Ensure Docker service exists
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: docker

# Explicit Xray image pull (idempotent; no :latest auto-pull on restart)
- name: Pull pinned Xray Docker image
  ansible.builtin.command:
    cmd: docker pull {{ xray_docker_image }}
  changed_when: false
  register: docker_pull
  become: true
  tags: docker

- name: Debug docker pull result
  ansible.builtin.debug:
    var: docker_pull
  when: xray_debug | default(false) | bool
  tags: docker,debug

# Prepare optional Cloudflare WARP outbound settings before rendering Xray config
- name: Include WARP tasks
  ansible.builtin.import_tasks: warp.yml
  when: warp_enabled | default(false) | bool
  tags: warp

# Configure firewall (skip if xray_manage_firewall=false; e.g. molecule container)
- name: Allow Xray port in firewall
  community.general.ufw:
    rule: allow
    port: '{{ xray_port }}'
    proto: tcp
  when: xray_manage_firewall | default(true) | bool
  tags: firewall

# Create directories
- name: Create Xray config directory
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    mode: '0700'
  tags: config

- name: Create Xray client configs directory
  ansible.builtin.file:
    path: "{{ xray_client_configs_dir }}"
    state: directory
    mode: '0750'
  tags: config

- name: Debug key path settings
  ansible.builtin.debug:
    msg:
      - "xray_config_dir={{ xray_config_dir }}"
      - "xray_client_configs_dir={{ xray_client_configs_dir }}"
      - "xray_docker_image={{ xray_docker_image }}"
      - "xray_port={{ xray_port }}"
      - "num_clients={{ num_clients }}"
      - "warp_enabled={{ warp_enabled | default(false) }}"
      - "xray_reality_rotate={{ xray_reality_rotate | default(false) }}"
  when: xray_debug | default(false) | bool
  tags: config,debug

# === REALITY identity persistence ===

# -- Step 1: Inspect current state --
- name: Check if REALITY state file exists
  ansible.builtin.stat:
    path: "{{ xray_config_dir }}/reality-state.json"
  register: reality_state_stat
  tags: config

- name: Check if existing Xray config exists (for migration)
  ansible.builtin.stat:
    path: "{{ xray_config_dir }}/config.json"
  register: existing_config_stat
  when: not reality_state_stat.stat.exists
  tags: config

- name: Debug file existence state
  ansible.builtin.debug:
    msg:
      - "reality_state_exists={{ reality_state_stat.stat.exists }}"
      - "existing_config_exists={{ existing_config_stat.stat.exists | default(false) }}"
  when: xray_debug | default(false) | bool
  tags: config,debug

# -- Step 2: Read existing state (if present) --
- name: Read REALITY state
  ansible.builtin.slurp:
    src: "{{ xray_config_dir }}/reality-state.json"
  register: reality_state_raw
  when: reality_state_stat.stat.exists
  tags: config

- name: Parse REALITY state
  ansible.builtin.set_fact:
    reality_state: "{{ reality_state_raw['content'] | b64decode | from_json }}"
  when: reality_state_stat.stat.exists
  tags: config

- name: Debug loaded REALITY state
  ansible.builtin.debug:
    var: reality_state
  when:
    - xray_debug | default(false) | bool
    - reality_state is defined
  tags: config,debug

# -- Step 3: Compute identity gates (BEFORE mutation) --
- name: Set identity gates
  ansible.builtin.set_fact:
    xray_do_migration: >-
      {{
        not reality_state_stat.stat.exists
        and (existing_config_stat.stat.exists | default(false))
        and not (xray_reality_rotate | default(false) | bool)
      }}
    xray_generate_identity: >-
      {{
        (xray_reality_rotate | default(false) | bool)
        or (not reality_state_stat.stat.exists
            and not (existing_config_stat.stat.exists | default(false)))
      }}
  tags: config

- name: Debug identity gates
  ansible.builtin.debug:
    msg:
      - "xray_do_migration={{ xray_do_migration }}"
      - "xray_generate_identity={{ xray_generate_identity }}"
  when: xray_debug | default(false) | bool
  tags: config,debug

# -- Step 4: Rotation (backup + delete state) --
- name: Backup state before rotation
  ansible.builtin.copy:
    src: "{{ xray_config_dir }}/reality-state.json"
    dest: "{{ xray_config_dir }}/reality-state.json.bak-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}"
    remote_src: true
    mode: '0600'
  when:
    - reality_state_stat.stat.exists
    - xray_reality_rotate | default(false) | bool
  tags: config

- name: Remove state to force regeneration
  ansible.builtin.file:
    path: "{{ xray_config_dir }}/reality-state.json"
    state: absent
  when:
    - reality_state_stat.stat.exists
    - xray_reality_rotate | default(false) | bool
  tags: config

# -- Step 5: Migration from existing config.json --
- name: Slurp existing config.json for migration
  ansible.builtin.slurp:
    src: "{{ xray_config_dir }}/config.json"
  register: existing_config_raw
  when: xray_do_migration | bool
  tags: config

- name: Parse existing config.json
  ansible.builtin.set_fact:
    existing_config: "{{ existing_config_raw['content'] | b64decode | from_json }}"
  when: xray_do_migration | bool
  tags: config

- name: Debug existing config structure
  ansible.builtin.debug:
    var: existing_config
  when:
    - xray_debug | default(false) | bool
    - xray_do_migration | bool
  tags: config,debug

- name: Extract identity from existing config
  ansible.builtin.set_fact:
    migrated_private_key: "{{ existing_config.inbounds[0].streamSettings.realitySettings.privateKey }}"
    migrated_short_id: "{{ existing_config.inbounds[0].streamSettings.realitySettings.shortIds[0] }}"
    migrated_uuids: "{{ existing_config.inbounds[0].settings.clients | map(attribute='id') | list }}"
  when: xray_do_migration | bool
  tags: config

- name: Debug migrated identity inputs
  ansible.builtin.debug:
    msg:
      - "migrated_private_key={{ migrated_private_key | default('UNDEFINED') }}"
      - "migrated_short_id={{ migrated_short_id | default('UNDEFINED') }}"
      - "migrated_uuids={{ migrated_uuids | default([]) }}"
  when:
    - xray_debug | default(false) | bool
    - xray_do_migration | bool
  tags: config,debug

- name: Derive public key from migrated private key
  ansible.builtin.shell: |
    set -o pipefail
    docker run --rm {{ xray_docker_image }} xray x25519 -i {{ migrated_private_key }}
  args:
    executable: /bin/bash
  register: migrated_public_key_raw
  changed_when: false
  no_log: true
  when: xray_do_migration | bool
  tags: config

- name: Debug migrated x25519 stdout
  ansible.builtin.debug:
    var: migrated_public_key_raw.stdout
  when:
    - xray_debug | default(false) | bool
    - xray_do_migration | bool
  tags: config,debug

- name: Debug migrated x25519 stdout_lines
  ansible.builtin.debug:
    var: migrated_public_key_raw.stdout_lines
  when:
    - xray_debug | default(false) | bool
    - xray_do_migration | bool
  tags: config,debug

- name: Parse migrated x25519 output
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json, os
    lines = json.loads(os.environ['XRAY_LINES'])
    value = None
    for line in lines:
        line = line.strip()
        if line.startswith('Password (PublicKey):'):
            value = line.split(':', 1)[1].strip()
            break
        if line.startswith('Password:'):
            value = line.split(':', 1)[1].strip()
            break
    if not value:
        raise SystemExit('xray x25519 output does not contain Password or Password (PublicKey) line during migration')
    print(value)
    PY
  args:
    executable: /bin/bash
  environment:
    XRAY_LINES: "{{ migrated_public_key_raw.stdout_lines | default([]) | to_json }}"
  register: migrated_public_key_parsed
  changed_when: false
  when: xray_do_migration | bool
  tags: config

- name: Debug migrated parsed public key output
  ansible.builtin.debug:
    var: migrated_public_key_parsed
  when:
    - xray_debug | default(false) | bool
    - xray_do_migration | bool
  tags: config,debug

- name: Set migrated public key
  ansible.builtin.set_fact:
    migrated_public_key: "{{ migrated_public_key_parsed.stdout | trim }}"
  when: xray_do_migration | bool
  tags: config

- name: Write migrated REALITY state
  ansible.builtin.copy:
    content: "{{ {
      'private_key': migrated_private_key,
      'public_key': migrated_public_key,
      'short_id': migrated_short_id,
      'client_uuids': migrated_uuids
    } | to_nice_json }}"
    dest: "{{ xray_config_dir }}/reality-state.json"
    mode: '0600'
  when: xray_do_migration | bool
  tags: config

- name: Set reality_state from migration
  ansible.builtin.set_fact:
    reality_state:
      private_key: "{{ migrated_private_key }}"
      public_key: "{{ migrated_public_key }}"
      short_id: "{{ migrated_short_id }}"
      client_uuids: "{{ migrated_uuids }}"
  when: xray_do_migration | bool
  tags: config

- name: Fail if migration necessary but failed
  ansible.builtin.fail:
    msg: "REALITY state file missing but config.json exists — migration failed. Check config.json integrity."
  when:
    - xray_do_migration | bool
    - reality_state is not defined
  tags: config

# -- Step 6: Fresh identity generation --
- name: Generate fresh REALITY private key
  ansible.builtin.shell: |
    set -o pipefail
    docker run --rm {{ xray_docker_image }} xray x25519 | awk -F': ' '/^PrivateKey:/ {print $2; exit}'
  args:
    executable: /bin/bash
  register: fresh_private_key_raw
  changed_when: false
  when: xray_generate_identity | bool
  tags: config

- name: Debug fresh private key details
  ansible.builtin.debug:
    msg:
      - "private_key_len={{ fresh_private_key_raw.stdout | length }}"
      - "private_key_repr={{ fresh_private_key_raw.stdout | to_json }}"
      - "private_key_lines={{ fresh_private_key_raw.stdout_lines | default([]) }}"
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Derive public key from fresh private key
  ansible.builtin.shell: |
    set -o pipefail
    docker run --rm {{ xray_docker_image }} xray x25519 -i {{ fresh_private_key_raw.stdout }}
  args:
    executable: /bin/bash
  register: fresh_public_key_raw
  changed_when: false
  no_log: true
  when: xray_generate_identity | bool
  tags: config

- name: Debug fresh x25519 stdout
  ansible.builtin.debug:
    var: fresh_public_key_raw.stdout
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Debug fresh x25519 stdout_lines
  ansible.builtin.debug:
    var: fresh_public_key_raw.stdout_lines
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Parse fresh x25519 output
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json, os
    lines = json.loads(os.environ['XRAY_LINES'])
    value = None
    for line in lines:
        line = line.strip()
        if line.startswith('Password (PublicKey):'):
            value = line.split(':', 1)[1].strip()
            break
        if line.startswith('Password:'):
            value = line.split(':', 1)[1].strip()
            break
    if not value:
        raise SystemExit('xray x25519 output does not contain Password or Password (PublicKey) line during fresh generation')
    print(value)
    PY
  args:
    executable: /bin/bash
  environment:
    XRAY_LINES: "{{ fresh_public_key_raw.stdout_lines | default([]) | to_json }}"
  register: fresh_public_key_parsed
  changed_when: false
  when: xray_generate_identity | bool
  tags: config

- name: Debug fresh parsed public key output
  ansible.builtin.debug:
    var: fresh_public_key_parsed
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Set fresh public key
  ansible.builtin.set_fact:
    fresh_public_key: "{{ fresh_public_key_parsed.stdout | trim }}"
  when: xray_generate_identity | bool
  tags: config

- name: Generate random short ID
  ansible.builtin.set_fact:
    fresh_short_id: "{{ lookup('password', '/dev/null chars=hexdigits length=8') }}"
  when: xray_generate_identity | bool
  tags: config

- name: Debug generated short ID
  ansible.builtin.debug:
    var: fresh_short_id
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Generate fresh client UUIDs
  ansible.builtin.set_fact:
    fresh_uuids: "{{ fresh_uuids | default([]) + [lookup('pipe', 'uuidgen')] }}"
  loop: "{{ range(num_clients | int) | list }}"
  when: xray_generate_identity | bool
  tags: config

- name: Debug generated fresh UUIDs
  ansible.builtin.debug:
    var: fresh_uuids
  when:
    - xray_debug | default(false) | bool
    - xray_generate_identity | bool
  tags: config,debug

- name: Write fresh REALITY state file
  ansible.builtin.copy:
    content: "{{ {
      'private_key': fresh_private_key_raw.stdout,
      'public_key': fresh_public_key,
      'short_id': fresh_short_id,
      'client_uuids': fresh_uuids
    } | to_nice_json }}"
    dest: "{{ xray_config_dir }}/reality-state.json"
    mode: '0600'
  when: xray_generate_identity | bool
  tags: config

- name: Set reality_state from fresh generation
  ansible.builtin.set_fact:
    reality_state:
      private_key: "{{ fresh_private_key_raw.stdout }}"
      public_key: "{{ fresh_public_key }}"
      short_id: "{{ fresh_short_id }}"
      client_uuids: "{{ fresh_uuids }}"
  when: xray_generate_identity | bool
  tags: config

# -- Step 7: UUID count adjustment (append only, never truncate state) --
- name: Ensure state has enough UUIDs for num_clients
  ansible.builtin.set_fact:
    reality_state: "{{ reality_state | combine({'client_uuids': reality_state.client_uuids + [lookup('pipe', 'uuidgen')]}) }}"
  loop: "{{ range([0, (num_clients | int) - (reality_state.client_uuids | length)] | max) | list }}"
  when:
    - reality_state is defined
    - (reality_state.client_uuids | length) < (num_clients | int)
  tags: config

- name: Persist updated UUID list to state file
  ansible.builtin.copy:
    content: "{{ reality_state | to_nice_json }}"
    dest: "{{ xray_config_dir }}/reality-state.json"
    mode: '0600'
  when:
    - reality_state is defined
    - (reality_state.client_uuids | length) != (num_clients | int)
  tags: config

- name: Debug final reality_state
  ansible.builtin.debug:
    var: reality_state
  when: xray_debug | default(false) | bool
  tags: config,debug

# -- Step 8: Set facts from reality_state (always) --
- name: Set REALITY facts from state
  ansible.builtin.set_fact:
    xray_vpn_xray_private_key: "{{ reality_state.private_key }}"
    xray_vpn_xray_public_key: "{{ reality_state.public_key }}"
    xray_vpn_xray_short_id: "{{ reality_state.short_id }}"
    xray_vpn_client_uuids: "{{ reality_state.client_uuids[:num_clients | int] }}"
  when: reality_state is defined
  tags: config

- name: Debug client UUIDs
  ansible.builtin.debug:
    msg: "Generated {{ num_clients }} client UUIDs: {{ xray_vpn_client_uuids }}"
  when: xray_vpn_client_uuids is defined
  tags: config

- name: Debug REALITY identity (public info only)
  ansible.builtin.debug:
    msg: |
      Public Key: {{ xray_vpn_xray_public_key }}
      Short ID: {{ xray_vpn_xray_short_id }}
      Client UUIDs: {{ xray_vpn_client_uuids }}
  when: xray_vpn_xray_public_key is defined
  tags: config

# Backup existing config before overwriting
- name: Stat existing Xray config
  ansible.builtin.stat:
    path: "{{ xray_config_dir }}/config.json"
  register: xray_config_stat
  when: xray_backup_enabled | default(true)
  tags: config,backup

- name: Backup Xray config before overwrite
  ansible.builtin.copy:
    src: "{{ xray_config_dir }}/config.json"
    dest: "{{ xray_config_dir }}/config.json.bak-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}"
    remote_src: true
    mode: '0600'
  when: xray_backup_enabled | default(true) and xray_config_stat.stat.exists
  tags: config,backup

# Create Xray configuration
- name: Create Xray config file
  ansible.builtin.template:
    src: xray_config.json.j2
    dest: "{{ xray_config_dir }}/config.json"
    mode: '0600'
  notify: Restart xray
  tags: config

# Backup existing systemd unit before overwriting
- name: Stat existing xray systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/xray.service
  register: xray_unit_stat
  when: xray_backup_enabled | default(true)
  tags: service,backup

- name: Backup xray systemd unit before overwrite
  ansible.builtin.copy:
    src: /etc/systemd/system/xray.service
    dest: "/etc/systemd/system/xray.service.bak-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}"
    remote_src: true
    mode: '0600'
  when: xray_backup_enabled | default(true) and xray_unit_stat.stat.exists
  tags: service,backup

# Create Xray systemd service file
- name: Create Xray systemd service
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    mode: '0644'
  notify: Reload systemd
  tags: service

# Export client configs
- name: Generate client configs
  ansible.builtin.template:
    src: client_config.json.j2
    dest: "{{ xray_client_configs_dir }}/client_{{ item.0 }}.json"
    mode: '0640'
  loop: "{{ range(num_clients | int) | list | zip(xray_vpn_client_uuids) | list }}"
  notify: Restart xray
  when: xray_vpn_client_uuids is defined
  tags: config

# Export Clash Verge / FlClash client configs (Mihomo Meta YAML)
- name: Generate Clash Meta YAML client configs
  ansible.builtin.template:
    src: clash_meta.yaml.j2
    dest: "{{ xray_client_configs_dir }}/clash_client_{{ item.0 }}.yaml"
    mode: '0640'
  loop: "{{ range(num_clients | int) | list | zip(xray_vpn_client_uuids) | list }}"
  when: xray_vpn_client_uuids is defined
  tags: config,clients

- name: Info - Config files ready
  ansible.builtin.debug:
    msg: "VPN config files exported to {{ xray_client_configs_dir }}/"
  tags: config

# Post-deploy smoke checks (non-fatal)
- name: Run smoke checks
  ansible.builtin.import_tasks: smoke.yml
  tags: smoke,always