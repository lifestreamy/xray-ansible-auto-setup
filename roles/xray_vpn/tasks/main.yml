---
# Assert runtime selector — fail early on invalid values.
- name: Assert xray_runtime is one of native|docker|podman
  ansible.builtin.assert:
    that:
      - xray_runtime in ['native', 'docker', 'podman']
    fail_msg: >-
      xray_runtime={{ xray_runtime | default('UNDEFINED') }} is not supported.
      Set xray_runtime in config/settings.yml to one of: native, docker, podman.
    success_msg: "xray_runtime={{ xray_runtime }} selected"

# Common setup: apt deps + set_fact xray_cli_command / xray_container_image.
- name: Include runtime setup
  ansible.builtin.import_tasks: runtime_setup.yml
  tags: runtime

# Runtime-specific install: docker engine / native tarball / podman engine.
# Must run BEFORE keys.yml — keygen invokes {{ xray_cli_command }}, which
# needs the engine (docker/podman) or the native binary in place.
- name: Include runtime-specific install
  ansible.builtin.import_tasks: "runtime_{{ xray_runtime }}.yml"
  tags: runtime

# REALITY identity persistence — single runtime-aware keygen (uses
# {{ xray_cli_command }} so the same path serves native/docker/podman).
- name: Include REALITY keys
  ansible.builtin.import_tasks: keys.yml
  tags: keys

# Prepare optional Cloudflare WARP outbound settings before rendering Xray config
- name: Include WARP tasks
  ansible.builtin.import_tasks: warp.yml
  when: warp_enabled | default(false) | bool
  tags: warp

# Configure firewall (skip if xray_manage_firewall=false; e.g. molecule container)
- name: Allow Xray port in firewall
  community.general.ufw:
    rule: allow
    port: '{{ xray_port }}'
    proto: tcp
  when: xray_manage_firewall | default(true) | bool
  tags: firewall

# Create directories
- name: Create Xray config directory
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    mode: '0700'
  tags: config

- name: Create Xray client configs directory
  ansible.builtin.file:
    path: "{{ xray_client_configs_dir }}"
    state: directory
    mode: '0750'
  tags: config

- name: Debug key path settings
  ansible.builtin.debug:
    msg:
      - "xray_config_dir={{ xray_config_dir }}"
      - "xray_client_configs_dir={{ xray_client_configs_dir }}"
      - "xray_docker_image={{ xray_docker_image }}"
      - "xray_port={{ xray_port }}"
      - "num_clients={{ num_clients }}"
      - "warp_enabled={{ warp_enabled | default(false) }}"
      - "xray_reality_rotate={{ xray_reality_rotate | default(false) }}"
  when: xray_debug | default(false) | bool
  tags: config,debug

# Backup existing config before overwriting
- name: Stat existing Xray config
  ansible.builtin.stat:
    path: "{{ xray_config_dir }}/config.json"
  register: xray_config_stat
  when: xray_backup_enabled | default(true)
  tags: config,backup

- name: Backup Xray config before overwrite
  ansible.builtin.copy:
    src: "{{ xray_config_dir }}/config.json"
    dest: "{{ xray_config_dir }}/config.json.bak-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}"
    remote_src: true
    mode: '0600'
  when: xray_backup_enabled | default(true) and xray_config_stat.stat.exists
  tags: config,backup

# Create Xray configuration
- name: Create Xray config file
  ansible.builtin.template:
    src: xray_config.json.j2
    dest: "{{ xray_config_dir }}/config.json"
    mode: '0600'
  notify: Restart xray
  tags: config

# Backup existing systemd unit before overwriting
- name: Stat existing xray systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/xray.service
  register: xray_unit_stat
  when: xray_backup_enabled | default(true)
  tags: service,backup

- name: Backup xray systemd unit before overwrite
  ansible.builtin.copy:
    src: /etc/systemd/system/xray.service
    dest: "/etc/systemd/system/xray.service.bak-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}"
    remote_src: true
    mode: '0600'
  when: xray_backup_enabled | default(true) and xray_unit_stat.stat.exists
  tags: service,backup

# Create Xray systemd service file (runtime-specific: native|docker|podman)
- name: Create Xray systemd service
  ansible.builtin.template:
    src: "xray.service.{{ xray_runtime }}.j2"
    dest: /etc/systemd/system/xray.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart xray
  tags: service

# Enable the unit for boot (all runtimes) and start it if not running.
# No daemon_reload here on purpose: unit-file changes already notify the
# "Reload systemd" / "Restart xray" handlers below; re-passing the flag on
# every converge churns systemd state. `state: started` is the idempotent
# first-deploy safety net (handler restarts only fire when files change).
- name: Enable and start xray service at boot
  ansible.builtin.systemd:
    name: xray
    state: started
    enabled: true
  become: true
  tags: service

# Export client configs
- name: Generate client configs
  ansible.builtin.template:
    src: client_config.json.j2
    dest: "{{ xray_client_configs_dir }}/client_{{ item.0 }}.json"
    mode: '0640'
  loop: "{{ range(num_clients | int) | list | zip(xray_vpn_client_uuids) | list }}"
  notify: Restart xray
  when: xray_vpn_client_uuids is defined
  tags: config

# Export Clash Verge / FlClash client configs (Mihomo Meta YAML)
- name: Generate Clash Meta YAML client configs
  ansible.builtin.template:
    src: clash_meta.yaml.j2
    dest: "{{ xray_client_configs_dir }}/clash_client_{{ item.0 }}.yaml"
    mode: '0640'
  loop: "{{ range(num_clients | int) | list | zip(xray_vpn_client_uuids) | list }}"
  when: xray_vpn_client_uuids is defined
  tags: config,clients

- name: Info - Config files ready
  ansible.builtin.debug:
    msg: "VPN config files exported to {{ xray_client_configs_dir }}/"
  tags: config

# Post-deploy smoke checks (non-fatal)
- name: Run smoke checks
  ansible.builtin.import_tasks: smoke.yml
  tags: smoke,always