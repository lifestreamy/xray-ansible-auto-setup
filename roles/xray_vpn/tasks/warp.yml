- name: Ensure Xray config dir exists
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    mode: "0700"

- name: Download wgcf binary
  ansible.builtin.get_url:
    url: "{{ warp_wgcf_url }}"
    dest: /usr/local/bin/wgcf
    mode: "0755"
    force: false
  tags: warp

- name: Register WARP account once
  ansible.builtin.command:
    cmd: /usr/local/bin/wgcf register --accept-tos
    chdir: "{{ xray_config_dir }}"
    creates: "{{ xray_config_dir }}/wgcf-account.toml"
  tags: warp

- name: Generate WARP WireGuard profile once
  ansible.builtin.command:
    cmd: /usr/local/bin/wgcf generate
    chdir: "{{ xray_config_dir }}"
    creates: "{{ xray_config_dir }}/wgcf-profile.conf"
  tags: warp

- name: Lock down WARP secrets
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - "{{ xray_config_dir }}/wgcf-account.toml"
    - "{{ xray_config_dir }}/wgcf-profile.conf"
  tags: warp

- name: Parse WARP profile without configparser
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json, os, re, sys

    profile_path = os.environ['WARP_PROFILE']
    want_ipv6 = os.environ.get('WARP_IPV6', 'false').lower() in ('true', '1', 'yes')

    try:
        with open(profile_path, 'r', encoding='utf-8') as f:
            lines = f.read().splitlines()
    except OSError as e:
        raise FileNotFoundError(f"cannot read WARP profile: {profile_path}") from e

    section = None
    iface = {}
    peer = {}

    for raw in lines:
        line = raw.strip()
        if not line or line.startswith('#') or line.startswith(';'):
            continue
        m = re.match(r'^\[(.+?)\]$', line)
        if m:
            section = m.group(1)
            continue
        if '=' not in line or section not in ('Interface', 'Peer'):
            continue
        key, value = [part.strip() for part in line.split('=', 1)]
        target = iface if section == 'Interface' else peer
        if key not in target:
            target[key] = value

    secret_key = iface.get('PrivateKey')
    address_line = iface.get('Address')
    peer_public_key = peer.get('PublicKey')

    if not secret_key or not address_line or not peer_public_key:
        raise RuntimeError('missing required WARP profile field')

    tokens = [t.strip() for t in address_line.split(',')]
    ipv4 = ipv6 = None
    for t in tokens:
        if '.' in t:
            ipv4 = t
        elif ':' in t:
            ipv6 = t

    if not ipv4:
        raise ValueError('no IPv4 tunnel address in WARP profile')
    if want_ipv6 and not ipv6:
        raise ValueError('warp_ipv6 is true but no IPv6 address in WARP profile')

    result = {'secret_key': secret_key, 'ipv4': ipv4, 'peer_public_key': peer_public_key}
    if want_ipv6:
        result['ipv6'] = ipv6

    json.dump(result, sys.stdout)
    PY
  environment:
    WARP_PROFILE: "{{ xray_config_dir }}/wgcf-profile.conf"
    WARP_IPV6: "{{ warp_ipv6 | default(false) | string }}"
  register: warp_parsed_raw
  changed_when: false
  tags: warp

- name: Build warp_parsed fact
  ansible.builtin.set_fact:
    warp_parsed: "{{ (warp_parsed_raw.stdout | from_json) | combine({'endpoint': warp_endpoint}) }}"
  tags: warp