---
# molecule/default/prepare.yml — runs ONCE after container create, before
# converge. Configures the inner dockerd (started by the role) to use the
# `vfs` storage driver instead of `overlay2`.
#
# Why: the molecule container runs on a host whose docker already uses
# overlay2; the role then starts its OWN dockerd inside the container. With
# overlay2-on-overlay2 the kernel rejects whiteout-file conversion during
# `docker pull` ("failed to convert whiteout file ... operation not permitted").
# vfs is slower but stable and avoids the overlay-on-overlay limitation.
#
# This file is molecule-only — it does NOT affect production deploys.

- name: Prepare | Configure inner dockerd with vfs storage driver
  # NOTE: molecule 26 puts the docker-managed host in `all` / `ungrouped`,
  # NOT in `instances` (which is the vagrant-style expectation). We target
  # `all` here so the playbook matches.
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write daemon.json with vfs storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "storage-driver": "vfs"
          }