---
# Molecule scenario for role `xray_vpn`.
# Driver: docker.
# Base image: geerlingguy/docker-ubuntu2204-ansible (systemd as PID 1).
# `privileged: true` is required because the role manages systemd units
# (`docker` service, `xray.service`) and uses `docker run` for key generation.
# The role installs and runs its OWN dockerd inside the container
# (docker-in-docker), so the published port 443 is reachable on the
# container's own localhost, not on the host.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: xray-ansible-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  # Role resolution: `provisioner.config_options` writes `roles_path = ../..`
  # into the subprocess ansible.cfg. From the molecule scenario's directory
  # (`molecule/default/`) that resolves to the repo root, where Ansible then
  # finds the `xray_vpn/` role subdirectory. This is the molecule-native
  # way to point at the project roles dir and works for all steps including
  # the `syntax` step (the previous `env.ANSIBLE_ROLES_PATH: ../../` had a
  # trailing-slash path bug AND didn't propagate to the syntax subprocess).
  config_options:
    defaults:
      roles_path: ../..
  inventory:
    group_vars:
      all:
        # --- role-critical vars (must match production) ---
        reality_camouflage_domain: dl.google.com
        xray_docker_image: "teddysun/xray:26.6.27"
        xray_config_dir: /root/xray-config
        xray_client_configs_dir: /root/vpn-configs
        xray_port: 443
        # Backups are timestamped and therefore not idempotent; disable in tests.
        xray_backup_enabled: false
        xray_reality_rotate: false
        # --- WARP — disabled in tests ---
        warp_enabled: false
        warp_ipv6: false
        warp_endpoint: "162.159.192.1:2408"
        warp_mtu: 1420
        warp_wgcf_version: "2.2.22"
        warp_wgcf_url: "https://github.com/ViRb3/wgcf/releases/download/v{{ warp_wgcf_version }}/wgcf_{{ warp_wgcf_version }}_linux_amd64"
        # --- test-only knobs ---
        num_clients: 1
        xray_debug: false
        # ufw/iptables are unreliable inside the molecule container; skip firewall.
        xray_manage_firewall: false
        # --- e2e (mihomo client in verify) ---
        xray_e2e_enabled: true
        mihomo_version: "1.19.29"
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml

verifier:
  name: ansible