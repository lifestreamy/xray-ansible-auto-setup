---
# Molecule scenario for role `xray_vpn`.
# Driver: default — molecule 26's name for the host-run (delegated)
# driver: runs Ansible directly on the molecule host (no
# managed container). The role installs Xray natively
# (xray_runtime: native, see group_vars below) on the host, so the
# listener is on localhost. CI runners and WSL instances with systemd
# as PID 1 are the supported execution targets.
#
# What changed vs the previous Docker+DinD scenario:
#   - No platform block (the default driver runs Ansible on the host).
#   - No inner dockerd / vfs storage driver (the role does not
#     install Docker for xray_runtime: native).
#   - group_vars set xray_runtime: native so the role dispatches to
#     tasks/runtime_native.yml.
#   - converge.yml uses connection: local (Ansible runs on the host
#     that molecule is invoked from).

dependency:
  name: galaxy

driver:
  name: default

provisioner:
  name: ansible
  # Role resolution: `provisioner.config_options` writes `roles_path = ../..`
  # into the subprocess ansible.cfg. From the molecule scenario's directory
  # (`molecule/default/`) that resolves to the repo root, where Ansible then
  # finds the `xray_vpn/` role subdirectory. molecule-native; works for
  # all steps including the `syntax` step.
  config_options:
    defaults:
      roles_path: ../..
  inventory:
    group_vars:
      all:
        # --- runtime selector (native scenario) ---
        xray_runtime: native
        # --- role-critical vars (must match production) ---
        reality_camouflage_domain: dl.google.com
        xray_container_repo: "ghcr.io/xtls/xray-core"
        xray_version: "26.6.27"
        xray_docker_image: "teddysun/xray:26.6.27"
        xray_config_dir: /root/xray-config
        xray_client_configs_dir: /root/vpn-configs
        xray_port: 443
        # Backups are timestamped and therefore not idempotent; disable in tests.
        xray_backup_enabled: false
        xray_reality_rotate: false
        # --- WARP — disabled in tests ---
        warp_enabled: false
        warp_ipv6: false
        warp_endpoint: "162.159.192.1:2408"
        warp_mtu: 1420
        warp_wgcf_version: "2.2.22"
        warp_wgcf_url: "https://github.com/ViRb3/wgcf/releases/download/v{{ warp_wgcf_version }}/wgcf_{{ warp_wgcf_version }}_linux_amd64"
        # --- test-only knobs ---
        num_clients: 1
        xray_debug: false
        # ufw/iptables are unreliable on the host runner; skip firewall.
        xray_manage_firewall: false
        # --- e2e (mihomo client in verify) ---
        xray_e2e_enabled: true
        mihomo_version: "1.19.29"
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml

verifier:
  name: ansible
